<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashcards — Electronics · sektor9.dev</title>
<style>
:root{--fg:#e2e8f0;--muted:#94a3b8;--accent:#14b8a6;--card:#1e293b;--bg:#0b1220}
body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:0}
.wrap{max-width:640px;margin:0 auto;padding:40px 20px;text-align:center}
h1{font-size:1.8rem;color:#fff;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:.9rem}
.stats{font-size:.8rem;color:var(--muted);margin-bottom:16px}
.flash{background:var(--card);border:1px solid #334155;border-radius:16px;min-height:240px;display:flex;align-items:center;justify-content:center;padding:30px;margin:0 0 16px;cursor:pointer;user-select:none;transition:transform .12s;font-size:1.15rem;line-height:1.5}
.flash:hover{transform:scale(1.01)}
.flash .back{color:#c7d2fe;display:none}
.flash.show .front{display:none}
.flash.show .back{display:block}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
button{font:inherit;padding:10px 18px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;transition:background .15s}
button:hover{background:#273449}
button.hard{background:#7f1d1d;border-color:#991b1b}
button.good{background:#14532d;border-color:#166534}
button.easy{background:#1e3a8a;border-color:#1d4ed8}
a.back{display:inline-block;margin-top:10px;color:var(--accent);font-size:.85rem}
</style></head><body><div class="wrap">
<h1>🧠 Flashcards — Electronics &amp; Microcontrollers</h1>
<p class="sub">Spaced-repetition review of the glossary terms · click a card to flip · rate yourself</p>
<p class="stats" id="stats"></p>
<div class="flash" id="flash"><div class="front"></div><div class="back"></div></div>
<div class="btns">
  <button class="hard" id="hard">Again</button>
  <button class="good" id="good">Good</button>
  <button class="easy" id="easy">Easy</button>
</div>
<div id="deck"></div>
<p><a class="back" href="/">← Back</a></p>
</div>
<script>
const CARDS = [{"front": "Analog signal", "back": "a signal whose value varies continuously (like a microphone's voltage) rather than jumping between discrete levels."}, {"front": "ADC (Analog-to-Digital Converter)", "back": "hardware that samples a continuous voltage and converts it to a number the CPU can read. On the ESP32: `analogRead()`."}, {"front": "Ampere (amp, A)", "back": "the SI unit of electric current; how many electrons flow past a point per second. See Current, Ohm's law."}, {"front": "AVR", "back": "the Atmel (now Microchip) 8-bit microcontroller family used in the Arduino Uno (ATmega328P)."}, {"front": "Baud rate", "back": "the number of symbol changes per second on a serial line; 9600 baud ≈ 9600 bits/s. The ESP32's default debug baud is 115200."}, {"front": "Breadboard", "back": "a reusable solderless board with rows of connected sockets for prototyping circuits quickly."}, {"front": "Button (push switch)", "back": "a momentary switch; connect it with a pull-up or pull-down so the pin reads a defined level when unpressed."}, {"front": "Capacitance", "back": "the ability of a component (a Capacitor) to store charge, measured in farads (F)."}, {"front": "Capacitor", "back": "a passive component that stores energy in an electric field; used for decoupling (smoothing power) and timing."}, {"front": "Clock (clock signal)", "back": "the periodic square wave that paces a microcontroller; a 16 MHz AVR executes close to one instruction per clock tick."}, {"front": "Current", "back": "the rate of electric charge flow, measured in amps (A). Flows through a circuit."}, {"front": "C++ class", "back": "in the ESP32 track, an object that bundles a peripheral's state (a pin) with its behavior (on/off), keeping hardware details tidy."}, {"front": "Datasheet", "back": "the manufacturer's authoritative document describing a chip's pins, registers, electrical limits, and timing. The ultimate reference for any microcontroller."}, {"front": "Debounce", "back": "cleaning up the noisy on/off chatter a physical button produces when pressed, giving one clean edge instead of many."}, {"front": "Decoupling capacitor", "back": "a capacitor placed near an IC to absorb supply-voltage spikes and keep the chip's power stable."}, {"front": "Digital signal", "back": "a signal with only discrete levels (HIGH/LOW, 1/0), as opposed to Analog signal."}, {"front": "Duty cycle", "back": "the fraction of a PWM period the output is HIGH, expressed as a %; 50 % gives the LED half brightness (on average)."}, {"front": "ESP32", "back": "Espressif's dual-core, Wi-Fi/Bluetooth-enabled SoC; the basis of the ESP32 devkit boards and this hub's C/C++ and MicroPython tracks."}, {"front": "Ground (GND)", "back": "the common 0 V reference for a circuit; every rail, device, and signal refers back to ground. Shared ground between boards is mandatory."}, {"front": "GPIO (General-Purpose Input/Output)", "back": "a pin you can configure as digital input or output, e.g. to read a button or drive an LED. See Pin, Register."}, {"front": "I²C (I2C)", "back": "a two-wire serial bus (SDA + SCL) for connecting sensors and small devices; used by many breakout boards."}, {"front": "Input pull-up", "back": "a pin configured as an input with an internal resistor pulling it HIGH; reading LOW then means \"pressed/active\". Saves an external resistor."}, {"front": "LED (light-emitting diode)", "back": "a diode that emits light; needs a Resistor to limit current. Long leg = anode, short leg = cathode."}, {"front": "Logic level", "back": "the voltage that counts as HIGH vs LOW. The ESP32 is 3.3 V logic and is not 5 V tolerant — feeding it 5 V can damage it."}, {"front": "Memory-mapped I/O", "back": "hardware registers exposed as ordinary memory addresses; setting a \"pin\" is just writing to a register. Core to the Arduino-in-C track."}, {"front": "Mermaid", "back": "the diagram language used across these tutorials to draw flowcharts and sequence diagrams."}, {"front": "Microcontroller (MCU)", "back": "a self-contained computer-on-a-chip: CPU, RAM, flash, and I/O on one die."}, {"front": "MicroPython", "back": "a lean reimplementation of Python 3 that runs directly on microcontrollers with a live REPL."}, {"front": "no_std", "back": "the Rust mode that forgoes the standard library (no OS/heap) for bare-metal targets. Core concept of the embedded Rust tutorial."}, {"front": "NeoPixel / WS2812", "back": "individually addressable RGB LED chips chained on a single data wire; driven in MicroPython via the `neopixel` module."}, {"front": "Object (language concept)", "back": "a programming construct bundling data and the functions that act on it; in C++ it's how we wrap a sensor or a pin."}, {"front": "Ohm (Ω)", "back": "the SI unit of electrical resistance."}, {"front": "Ohm's law", "back": "`V = I × R`: voltage = current × resistance. The single most-used equation in electronics. See Voltage, Current, Resistance."}, {"front": "Output (pin)", "back": "a GPIO configured to drive a HIGH or LOW voltage, e.g. to light an LED."}, {"front": "Pin", "back": "a physical or logical I/O terminal on a chip or board."}, {"front": "Pointer", "back": "a programming variable that holds a memory address instead of a value; essential for register-level access in AVR C and for bridging to hardware in Rust."}, {"front": "Pull-up resistor", "back": "a resistor from a signal to VCC that holds the line HIGH when nothing drives it low."}, {"front": "PWM (Pulse-Width Modulation)", "back": "rapidly toggling a pin HIGH/LOW with a controlled Duty cycle; an LED appears a dimmer brightness (or a motor turns slower) at lower duty."}, {"front": "REPL (Read-Eval-Print Loop)", "back": "an interactive prompt where each line runs instantly; MicroPython's signature workflow."}, {"front": "Register", "back": "a tiny piece of memory, often one byte, that controls or reflects hardware; e.g. `DDRB`, `PORTB` on the AVR."}, {"front": "Resistance", "back": "how strongly a component opposes current, measured in ohms (Ω)."}, {"front": "Resistor", "back": "a passive component that resists current, protecting an LED or setting a reference level. Typical LED series value: 220 Ω."}, {"front": "Rust", "back": "a systems language with compile-time memory safety (ownership); well-suited to no_std embedded dev."}, {"front": "Serial", "back": "a method of sending data one bit at a time over a wire; the \"Serial Monitor\" and 9600/115200 baud links."}, {"front": "SPI", "back": "a four-wire high-speed serial interface for external chips and displays."}, {"front": "SoC (System-on-Chip)", "back": "an integrated circuit that puts CPU plus peripherals (Wi-Fi, timers, ADC) together, like the ESP32."}, {"front": "Timer", "back": "internal hardware that counts clock cycles; powers delays, PWM, and microsecond timing."}, {"front": "Voltage (V)", "back": "electrical \"pressure\" or potential difference between two points, measured in volts."}, {"front": "WS2812", "back": "see NeoPixel / WS2812."}, {"front": "Wi-Fi", "back": "the wireless networking protocol built into the ESP32; used in the HTTP server tutorial to control an LED from a browser."}];
// spaced-repetition: simple Leitner boxes persisted in localStorage
const LS='sektor9-srs-elec-v1';
let boxes=JSON.parse(localStorage.getItem(LS)||'{}');
let idx=0, deck=[];
function buildDeck(){
  deck=[];
  for(let i=0;i<CARDS.length;i++){let b=boxes[i]||0; for(let j=0;j<=b;j++) deck.push(i);}
  shuffle(deck);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}}
function render(){
  if(!deck.length) buildDeck();
  if(idx>=deck.length){ document.getElementById('flash').innerHTML='<div>🎉 Deck complete! <button onclick="restart()">Review again</button></div>'; document.getElementById('stats').textContent='done'; return; }
  let ci=deck[idx];
  let f=document.getElementById('flash');
  f.classList.remove('show');
  f.querySelector('.front').textContent=CARDS[ci].front;
  f.querySelector('.back').textContent=CARDS[ci].back;
  let due=Object.values(boxes).reduce((a,b)=>a+Math.min(b,1),0);
  let mastered=Object.values(boxes).filter(b=>b>=5).length;
  document.getElementById('stats').textContent=cardCount+' terms · '+deck.length+' cards · mastered '+mastered;
}
function rate(step){if(idx>=deck.length)return; let ci=deck[idx]; boxes[ci]=Math.max(0,Math.min(8,(boxes[ci]||0)+step)); localStorage.setItem(LS,JSON.stringify(boxes)); idx++; render();}
function restart(){idx=0; buildDeck(); render();}
document.getElementById('flash').addEventListener('click',()=>{document.getElementById('flash').classList.toggle('show');});
document.getElementById('hard').onclick=()=>rate(-2);
document.getElementById('good').onclick=()=>rate(1);
document.getElementById('easy').onclick=()=>rate(3);
const cardCount=CARDS.length;
buildDeck(); render();
</script></body></html>
