const state = {diff:'all', subj:'all', type:'all'};

function init(){
  document.querySelectorAll('.filters .chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const grp=chip.parentElement.id;
      if(grp==='f-diff') state.diff=chip.dataset.v;
      else if(grp==='f-subj') state.subj=chip.dataset.v;
      else if(grp==='f-type') state.type=chip.dataset.v;
      document.querySelectorAll('#'+grp+' .chip').forEach(c=>c.classList.toggle('on', c===chip));
      render();
    });
  });
  render();
}
function render(){
  const items = DATA.filter(it=>{
    if(state.diff!=='all' && it.difficulty!==state.diff) return false;
    if(state.subj!=='all' && it.subject!==state.subj) return false;
    if(state.type!=='all' && it.type!==state.type) return false;
    return true;
  });
  document.getElementById('count').textContent = items.length + ' item' + (items.length===1?'':'s');
  document.getElementById('empty').style.display = items.length?'none':'block';
  const box=document.getElementById('results');
  box.innerHTML = items.map(it=>
    '<div class="item"><div class="t">'+esc(it.title)+'</div><div class="badges">'+
    '<span class="badge bd-'+it.difficulty+'">'+it.difficulty+'</span>'+
    '<span class="badge bs-'+it.subject+'">'+it.subject+'</span>'+
    '<span class="badge" style="background:#1e293b;color:#94a3b8">'+it.type+'</span>'+
    '</div>'+(it.url?'<a href="'+esc(it.url)+'" target="_blank" rel="noopener">Open →</a>':'')+'</div>'
  ).join('');
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
init();
