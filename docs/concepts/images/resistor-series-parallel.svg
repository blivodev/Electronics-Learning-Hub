<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="Arial, Helvetica, sans-serif">
  <title>Resistor Color Code and Series/Parallel</title>

  <!-- Resistor color bands -->
  <g font-size="12">
    <text x="20" y="30" font-weight="bold" fill="#0b7285">Reading a 4-band resistor</text>
    <g>
      <!-- resistor body -->
      <rect x="60" y="50" width="260" height="46" fill="#e9ecef" stroke="#495057" stroke-width="2" rx="20"/>
      <rect x="30" y="60" width="30" height="26" fill="#adb5bd"/>
      <rect x="320" y="60" width="30" height="26" fill="#adb5bd"/>
      <!-- bands -->
      <rect x="120" y="52" width="26" height="42" fill="#a52a2a"/>
      <rect x="152" y="52" width="26" height="42" fill="#800000"/>
      <rect x="184" y="52" width="26" height="42" fill="#f08c00"/>
      <rect x="216" y="52" width="26" height="42" fill="#fcc419"/>
      <rect x="248" y="52" width="26" height="42" fill="#adb5bd"/>
      <text x="155" y="38" text-anchor="middle" font-weight="bold" fill="#333">red (2)</text>
      <text x="197" y="38" text-anchor="middle" font-weight="bold" fill="#333">orange (×1k)</text>
      <text x="60" y="112" text-anchor="middle" font-size="11" fill="#666">2 , 2 × 1000 = 22 kΩ ±5%</text>
    </g>
  </g>

  <!-- Series -->
  <g font-size="12">
    <text x="20" y="150" font-weight="bold" fill="#2b8a3e">Series (current same, voltages add)</text>
    <line x1="30" y1="180" x2="150" y2="180" stroke="#333" stroke-width="3"/>
    <rect x="150" y="162" width="70" height="36" fill="#fff3bf" stroke="#f08c00" stroke-width="2" rx="4"/>
    <text x="185" y="184" text-anchor="middle" font-weight="bold" fill="#e8590c">R1</text>
    <line x1="220" y1="180" x2="240" y2="180" stroke="#333" stroke-width="3"/>
    <rect x="240" y="162" width="70" height="36" fill="#fff3bf" stroke="#f08c00" stroke-width="2" rx="4"/>
    <text x="275" y="184" text-anchor="middle" font-weight="bold" fill="#e8590c">R2</text>
    <line x1="310" y1="180" x2="430" y2="180" stroke="#333" stroke-width="3"/>
    <text x="230" y="220" text-anchor="middle" font-size="11" fill="#333">R_total = R1 + R2 (same current I)</text>
  </g>

  <!-- Parallel -->
  <g font-size="12">
    <text x="20" y="250" font-weight="bold" fill="#c92a2a">Parallel (voltage same, currents add)</text>
    <line x1="40" y1="290" x2="300" y2="290" stroke="#333" stroke-width="3"/>
    <line x1="60" y1="290" x2="60" y2="270" stroke="#333" stroke-width="3"/>
    <line x1="280" y1="290" x2="280" y2="270" stroke="#333" stroke-width="3"/>
    <rect x="100" y="258" width="80" height="24" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2" rx="4"/>
    <text x="140" y="274" text-anchor="middle" font-weight="bold" fill="#c92a2a">R1</text>
    <rect x="200" y="258" width="80" height="24" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2" rx="4"/>
    <text x="240" y="274" text-anchor="middle" font-weight="bold" fill="#c92a2a">R2</text>
    <text x="230" y="318" text-anchor="middle" font-size="11" fill="#333">R_total = (R1×R2)/(R1+R2) (same voltage V)</text>
  </g>
</svg>
