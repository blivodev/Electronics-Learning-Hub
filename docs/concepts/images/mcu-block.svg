<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="Arial, Helvetica, sans-serif">
  <title>Microcontroller Block Diagram</title>

  <!-- MCU outer chip -->
  <rect x="40" y="40" width="380" height="240" fill="#e7f5ff" stroke="#0b7285" stroke-width="3" rx="10"/>
  <text x="230" y="65" text-anchor="middle" font-weight="bold" fill="#0b7285" font-size="14">A Microcontroller (one chip)</text>

  <!-- CPU -->
  <rect x="165" y="95" width="130" height="55" fill="#fff3bf" stroke="#f08c00" stroke-width="2" rx="6"/>
  <text x="230" y="118" text-anchor="middle" font-weight="bold" fill="#e8590c">CPU</text>
  <text x="230" y="136" text-anchor="middle" font-size="11" fill="#333">the brain</text>

  <!-- Memory -->
  <rect x="165" y="170" width="130" height="55" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2" rx="6"/>
  <text x="230" y="193" text-anchor="middle" font-weight="bold" fill="#2b8a3e">Memory</text>
  <text x="230" y="211" text-anchor="middle" font-size="11" fill="#333">Flash prog + RAM</text>

  <!-- Peripherals -->
  <rect x="165" y="245" width="130" height="30" fill="#e5dbff" stroke="#7048e8" stroke-width="2" rx="6"/>
  <text x="230" y="264" text-anchor="middle" font-weight="bold" fill="#5f3dc4">Peripherals (timer/ADC/serial)</text>

  <!-- GPIO connection -->
  <line x1="295" y1="122" x2="380" y2="122" stroke="#7048e8" stroke-width="3"/>
  <line x1="295" y1="197" x2="380" y2="197" stroke="#7048e8" stroke-width="3"/>
  <rect x="380" y="85" width="40" height="180" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2" rx="4"/>
  <text x="400" y="160" text-anchor="middle" transform="rotate(90 400 160)" font-weight="bold" fill="#c92a2a" font-size="12">GPIO pins</text>

  <!-- Connecting wires outward -->
  <line x1="420" y1="105" x2="560" y2="105" stroke="#c92a2a" stroke-width="3"/>
  <line x1="420" y1="160" x2="560" y2="160" stroke="#c92a2a" stroke-width="3"/>
  <line x1="420" y1="215" x2="560" y2="215" stroke="#c92a2a" stroke-width="3"/>
  <line x1="420" y1="250" x2="560" y2="250" stroke="#c92a2a" stroke-width="3"/>

  <!-- External things -->
  <g font-size="11" fill="#333">
    <rect x="560" y="90" width="70" height="30" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
    <text x="595" y="109" text-anchor="middle">LED</text>
    <rect x="560" y="145" width="70" height="30" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
    <text x="595" y="164" text-anchor="middle">Button</text>
    <rect x="560" y="200" width="70" height="30" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
    <text x="595" y="219" text-anchor="middle">Sensor</text>
    <rect x="560" y="235" width="70" height="30" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
    <text x="595" y="254" text-anchor="middle">Motor</text>
  </g>

  <!-- caption -->
  <g font-size="12" fill="#444">
    <rect x="40" y="305" width="560" height="20" fill="#f1f3f5" rx="3"/>
    <text x="50" y="319">CPU, memory, peripherals and GPIO all live on one chip; GPIO connects to LEDs, buttons, sensors and motors in the outside world.</text>
  </g>
</svg>
